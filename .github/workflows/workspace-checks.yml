name: Incubator workspace checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run verify:workspace
      - name: Export Egg Snap on every target
        run: npm run export --workspace=egg-snap
      - run: npm run verify:story-flows --workspace=katchimeras
      - name: Verify native presentation ownership and handoffs
        working-directory: apps/katchimeras
        run: npx tsx --test tests/native-transition-regressions.test.tsx
