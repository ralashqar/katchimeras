name: iOS Preview Build

run-name: iOS preview from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      refresh_devices:
        description: Include newly registered iPhones
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build iOS preview on EAS
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        working-directory: katchimeras

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: katchimeras/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install asset-check dependencies
        run: python -m pip install Pillow==10.3.0

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 22.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run preview preflight
        run: npm run build:ios:preview:check

      - name: Verify story flows
        run: npm run verify:story-flows

      - name: Refresh runtime asset exclusions
        run: npm run assets:audit:write

      - name: Verify upload contents and archive size
        run: npm run build:archive:check

      - name: Build iOS preview
        env:
          REFRESH_DEVICES: ${{ inputs.refresh_devices }}
        shell: bash
        run: |
          if [ "$REFRESH_DEVICES" = "true" ]; then
            eas build \
              --platform ios \
              --profile preview \
              --non-interactive \
              --refresh-ad-hoc-provisioning-profile
          else
            eas build \
              --platform ios \
              --profile preview \
              --non-interactive
          fi
